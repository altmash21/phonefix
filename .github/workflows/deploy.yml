name: Deploy to Shared Hosting via SSH

on:
  push:
    branches: [ master, main ]

jobs:
  build-and-deploy:
    name: Build & Deploy via SSH
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, dom, fileinfo, gd, intl, json, openssl, pdo, pdo_mysql, zip, bcmath
          coverage: none

      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Cache Composer Dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install PHP Dependencies (Production)
        run: composer install --prefer-dist --no-interaction --no-progress --no-dev --optimize-autoloader

      - name: Install NPM & Compile Frontend Assets
        run: |
          npm ci
          npm run production

      - name: Prepare Staging Folders (app/ and public_html/)
        run: |
          mkdir -p deploy/public_html deploy/app

          # 1. Copy compiled frontend assets to deploy/public_html
          cp -r public/* deploy/public_html/
          [ -f public/.htaccess ] && cp public/.htaccess deploy/public_html/ || true

          # 2. Update index.php in deploy/public_html to point to ../app
          sed -i "s|__DIR__\s*\.\s*'\/..\/storage|__DIR__ . '\/..\/app\/storage|g" deploy/public_html/index.php
          sed -i "s|__DIR__\s*\.\s*'\/..\/vendor|__DIR__ . '\/..\/app\/vendor|g" deploy/public_html/index.php
          sed -i "s|__DIR__\s*\.\s*'\/..\/bootstrap|__DIR__ . '\/..\/app\/bootstrap|g" deploy/public_html/index.php
          sed -i "/\$app = require_once/a \    \$app->usePublicPath(__DIR__);" deploy/public_html/index.php

          # 3. Copy core backend application code to deploy/app
          rsync -av \
            --exclude='public' \
            --exclude='deploy' \
            --exclude='node_modules' \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.env*' \
            --exclude='tests' \
            --exclude='vendor/**/tests' \
            --exclude='vendor/**/Tests' \
            --exclude='vendor/**/doc' \
            --exclude='vendor/**/docs' \
            ./ deploy/app/

      - name: Setup SSH Key & Known Hosts
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          chmod 644 ~/.ssh/known_hosts

      - name: Verify SSH Connection
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
        run: |
          echo "Testing SSH connection to $SSH_USER@$SSH_HOST on port $SSH_PORT..."
          ssh -p "$SSH_PORT" -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no -o ConnectTimeout=15 "$SSH_USER@$SSH_HOST" "echo 'SSH Connected successfully as user:' \$(whoami)"

      - name: Transfer Files via SSH Stream
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
          TARGET_DIR: ${{ secrets.SSH_TARGET_DIR || 'domains/mauryamobilee.in' }}
        run: |
          echo "Streaming staged files to $TARGET_DIR on server..."
          tar -czf - -C deploy . | ssh -p "$SSH_PORT" -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no "$SSH_USER@$SSH_HOST" "mkdir -p $TARGET_DIR && tar -xzf - -C $TARGET_DIR"

      - name: Post-Deploy Optimization on Server
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
        run: |
          ssh -p "$SSH_PORT" -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no "$SSH_USER@$SSH_HOST" << 'EOF'
            APP_DIR="$HOME/domains/mauryamobilee.in/app"
            if [ ! -d "$APP_DIR" ]; then
              APP_DIR="$HOME/app"
            fi

            if [ -f "$APP_DIR/artisan" ]; then
              echo "Running database migrations and optimizations in $APP_DIR..."
              cd "$APP_DIR"
              chmod -R 775 storage bootstrap/cache || true
              php artisan migrate --force
              php artisan optimize:clear || true
              php artisan config:cache || true
              php artisan route:cache || true
              php artisan view:cache || true
              echo "Deployment optimizations and migrations completed successfully!"
            else
              echo "Notice: artisan not found at $APP_DIR yet, skipping migrations."
            fi
          EOF

