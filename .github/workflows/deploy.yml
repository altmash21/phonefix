name: Deploy to Shared Hosting via SSH

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:
    inputs:
      seed_catalog:
        description: 'Seed Accessories & Repairs Catalog (default: false)'
        required: false
        default: false
        type: boolean

jobs:
  build-and-deploy:
    name: Build & Deploy via SSH
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, dom, fileinfo, gd, intl, json, openssl, pdo, pdo_mysql, zip, bcmath
          coverage: none

      - name: Cache Composer Dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install PHP Dependencies (Production)
        run: composer install --prefer-dist --no-interaction --no-progress --no-dev --optimize-autoloader --no-scripts

      - name: Prepare Staging Folders (app/ and public_html/)
        run: |
          mkdir -p deploy/public_html deploy/app

          # 1. Copy compiled frontend assets to deploy/public_html
          cp -r public/* deploy/public_html/
          [ -f public/.htaccess ] && cp public/.htaccess deploy/public_html/ || true

          # 2. Update index.php in deploy/public_html to point to ../app
          sed -i "s|__DIR__\s*\.\s*'\/..\/storage|__DIR__ . '\/..\/app\/storage|g" deploy/public_html/index.php
          sed -i "s|__DIR__\s*\.\s*'\/..\/vendor|__DIR__ . '\/..\/app\/vendor|g" deploy/public_html/index.php
          sed -i "s|__DIR__\s*\.\s*'\/..\/bootstrap|__DIR__ . '\/..\/app\/bootstrap|g" deploy/public_html/index.php
          sed -i "/\$app = require_once/a \    \$app->usePublicPath(__DIR__);" deploy/public_html/index.php

          # 3. Copy core backend application code to deploy/app
          rsync -av \
            --exclude='/public' \
            --exclude='/deploy' \
            --exclude='/node_modules' \
            --exclude='/.git' \
            --exclude='/.github' \
            --exclude='/.env*' \
            --exclude='/tests' \
            --exclude='vendor/**/tests' \
            --exclude='vendor/**/Tests' \
            --exclude='vendor/**/doc' \
            --exclude='vendor/**/docs' \
            ./ deploy/app/

      - name: Setup SSH Key & Known Hosts
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          chmod 644 ~/.ssh/known_hosts

      - name: Verify SSH Connection
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
        run: |
          echo "Testing SSH connection to $SSH_USER@$SSH_HOST on port $SSH_PORT..."
          ssh -p "$SSH_PORT" -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no -o ConnectTimeout=15 "$SSH_USER@$SSH_HOST" "echo 'SSH Connected successfully as user:' \$(whoami)"

      - name: Incremental File Sync via SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
          TARGET_DIR: ${{ secrets.SSH_TARGET_DIR || 'domains/mauryamobilee.in' }}
        run: |
          # Auto-detect actual hosting domain folder if not explicitly provided
          if [ -z "${{ secrets.SSH_TARGET_DIR }}" ]; then
            DETECTED_DIR=$(ssh -p "$SSH_PORT" -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no "$SSH_USER@$SSH_HOST" '
              if [ -d "domains/mauryamobilee.in" ]; then
                echo "domains/mauryamobilee.in"
              elif [ -d "domains/phonefixazamgarh.com" ]; then
                echo "domains/phonefixazamgarh.com"
              fi
            ' 2>/dev/null || true)
            if [ -n "$DETECTED_DIR" ]; then
              TARGET_DIR="$DETECTED_DIR"
            fi
          fi
          echo "Target sync directory: $TARGET_DIR"

          # Use incremental rsync if available on remote host to avoid re-uploading unchanged files
          if ssh -p "$SSH_PORT" -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no "$SSH_USER@$SSH_HOST" "which rsync" >/dev/null 2>&1; then
            echo "Fast incremental rsync detected on server. Syncing changed files only..."
            rsync -avz --no-perms --no-owner --no-group \
              --exclude='.env*' \
              --exclude='storage/logs/*' \
              --exclude='storage/framework/cache/*' \
              --exclude='storage/framework/sessions/*' \
              --exclude='storage/framework/views/*' \
              -e "ssh -p $SSH_PORT -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no" \
              deploy/ "$SSH_USER@$SSH_HOST:$TARGET_DIR/"
          else
            echo "Streaming staged files to $TARGET_DIR on server via tar..."
            tar -czf - -C deploy . | ssh -p "$SSH_PORT" -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no "$SSH_USER@$SSH_HOST" "mkdir -p $TARGET_DIR && tar -xzf - -C $TARGET_DIR"
          fi

      - name: Post-Deploy Incremental Update on Server (Migrations & Admin Seeding)
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
          TARGET_DIR: ${{ secrets.SSH_TARGET_DIR || 'domains/mauryamobilee.in' }}
          RUN_CATALOG_SEED: ${{ github.event.inputs.seed_catalog || 'false' }}
        run: |
          ssh -p "$SSH_PORT" -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no "$SSH_USER@$SSH_HOST" \
            bash -s -- "$TARGET_DIR" "$RUN_CATALOG_SEED" < scripts/deploy_remote.sh

