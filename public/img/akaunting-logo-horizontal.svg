<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 400" width="1400" height="400">
  <defs>
    <linearGradient id="pfHorizGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>
  </defs>
  <!-- Brand Icon -->
  <g transform="translate(60, 40) scale(0.625)">
    <!-- Background Squircle -->
    <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#pfHorizGrad)"/>
    <rect x="24" y="24" width="464" height="232" rx="112" fill="url(#glowGrad)"/>
    <!-- Phone Body -->
    <rect x="156" y="96" width="200" height="320" rx="36" fill="#FFFFFF" />
    <!-- Phone Screen -->
    <rect x="174" y="138" width="164" height="228" rx="16" fill="#1E1B4B" />
    <!-- Screen Letter 'P' -->
    <path d="M214 175 H260 C279 175 294 188 294 206 C294 224 279 237 260 237 H236 V285 H214 V175 Z M236 195 V217 H258 C266 217 272 212 272 206 C272 200 266 195 258 195 H236 Z" fill="#6366F1" />
    <!-- Fix checkmark badge -->
    <circle cx="286" cy="268" r="16" fill="#10B981" />
    <path d="M279 268 L284 273 L293 263" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <!-- Speaker & Home Bar -->
    <rect x="231" y="116" width="50" height="6" rx="3" fill="#CBD5E1" />
    <rect x="236" y="384" width="40" height="6" rx="3" fill="#CBD5E1" />
  </g>
  <!-- Wordmark Text -->
  <text x="430" y="225" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="140" font-weight="900" fill="#0F172A" letter-spacing="-2">Phone<tspan fill="#4F46E5">Fix</tspan></text>
  <text x="435" y="295" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="34" font-weight="800" fill="#64748B" letter-spacing="8">AZAMGARH • ERP CONSOLE</text>
</svg>
